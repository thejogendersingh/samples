<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="100%" height="100%">
  <defs>
    <linearGradient id="fullGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#C6922C" />
      <stop offset="75%" stop-color="#A27118" />
      <stop offset="100%" stop-color="#6E4A0C" />
    </linearGradient>

    <linearGradient id="fullGoldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B38022" />
      <stop offset="45%" stop-color="#FDF3CD" />
      <stop offset="60%" stop-color="#E1B851" />
      <stop offset="100%" stop-color="#8F6212" />
    </linearGradient>

    <radialGradient id="fullBadgeDark" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1E26" />
      <stop offset="60%" stop-color="#121217" />
      <stop offset="100%" stop-color="#0A0A0D" />
    </radialGradient>
  </defs>

  <!-- Left Icon Emblem (scaled inside 56x56 box) -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="56" height="56" rx="15" fill="url(#fullBadgeDark)" stroke="url(#fullGoldPrimary)" stroke-width="1.6" />
    <rect x="3.5" y="3.5" width="49" height="49" rx="12" fill="none" stroke="url(#fullGoldShine)" stroke-width="0.6" opacity="0.7" stroke-dasharray="2 1" />
    
    <!-- Crown -->
    <circle cx="21" cy="14" r="1.1" fill="url(#fullGoldShine)" />
    <circle cx="28" cy="11.5" r="1.4" fill="#FFF8D6" />
    <circle cx="35" cy="14" r="1.1" fill="url(#fullGoldShine)" />
    <path d="M21 16 L24 19 L28 15 L32 19 L35 16 L33 21 L23 21 Z" fill="url(#fullGoldPrimary)" />

    <!-- Monogram ICM -->
    <g fill="url(#fullGoldShine)">
      <!-- I -->
      <rect x="15" y="24" width="3.2" height="17" rx="0.8" />
      <path d="M13 24 H20 V25.6 H13 Z M13 39.4 H20 V41 H13 Z" />
      <!-- C -->
      <path d="M29 24.5 C23 24.5 19.5 28 19.5 32.5 C19.5 37 23 40.5 29 40.5 C32 40.5 34.5 39.2 35.8 37.4 L33.8 35.8 C32.8 37.2 31 38.2 28.8 38.2 C24.4 38.2 22.2 35.2 22.2 32.5 C22.2 29.8 24.4 26.8 28.8 26.8 C31 26.8 32.8 27.8 33.8 29.2 L35.8 27.6 C34.5 25.8 32 24.5 29 24.5 Z" />
      <!-- M -->
      <path d="M36 24 H39 L41.5 33 L44 24 H47 V41 H44.2 V28.8 L42.2 35.8 H40.8 L38.8 28.8 V41 H36 Z" />
    </g>

    <!-- Bottom Accent -->
    <path d="M23 45 C26 43.8 30 43.8 33 45 C31 46 25 46 23 45 Z" fill="url(#fullGoldPrimary)" opacity="0.8" />
  </g>

  <!-- Right Typography -->
  <!-- INVCRAFT -->
  <text x="72" y="36" font-family="'Playfair Display', Georgia, serif" font-size="23" font-weight="700" letter-spacing="1.2" fill="#111115">
    INVCRAFT
  </text>
  
  <!-- MEDIA badge -->
  <rect x="228" y="21" width="62" height="18" rx="4" fill="url(#fullGoldPrimary)" />
  <text x="259" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.8" fill="#ffffff" text-anchor="middle">
    MEDIA
  </text>

  <!-- Tagline -->
  <text x="73" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.2" font-weight="600" letter-spacing="1.2" fill="#8A8A9A">
    DIGITAL WEDDING INVITATIONS
  </text>
</svg>

